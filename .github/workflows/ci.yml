name: ci

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'pull_request' && 'vercel-preview' || (github.ref_name == 'production' && 'vercel-production' || 'vercel-preview') }}
    env:
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_PUBLIC_AWS_REGION: eu-west-1
      NEXT_PUBLIC_COGNITO_APP_CLIENT_ID: ci-cognito-client-id
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: eu-west-1_ci
      APP_SESSION_SECRET: ci-session-secret-not-for-runtime
      # ENV-057 — le code ne lit QUE `KYCLY_BASE_URL`. Les trois noms posés ici
      # auparavant (`KYCLY_API_BASE_URL`, `KYCLY_SESSION_BASE_URL`,
      # `KYCLY_ME_BASE_URL`) n'étaient lus par personne : le build tournait donc
      # sur le repli `https://api.kycly.sn`, un domaine qui ne résout pas.
      KYCLY_BASE_URL: https://sandbox.partner-node.example.com
      DEFAULT_KYCLINK_THEME: kycly-light

    steps:
      - name: Guard production PR source
        if: github.event_name == 'pull_request' && github.base_ref == 'production' && github.head_ref != 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "::error::Les PR vers 'production' doivent provenir de 'main' (source actuelle : '$HEAD_REF'). Ouvrez d'abord une PR vers 'main', puis une PR de promotion main -> production."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historique complet : le garde doc-drift compare deux SHA (base et tete de la PR
          # ou du push). Sur un checkout superficiel la base est absente et le garde echoue
          # FERME — c'est voulu.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: pnpm install --frozen-lockfile

      # Barriere de securite des dependances. Elle lit l'arbre que pnpm a REELLEMENT
      # resolu, pas un arbre npm reconstruit qui ignorerait pnpm.overrides. Elle bloque
      # sur high/critical et affiche les avis sous ce seuil.
      - name: Security audit
        run: node scripts/security/audit-pnpm-tree.mjs

      # Jusqu'au 2026-09-30 ce pas lancait `pnpm docs:check` SANS reference : le script ne
      # lisait que l'arbre de travail et l'index, vides sur le checkout de la CI — il se
      # declarait toujours « skipped ». Il compare desormais la base et la tete du changement.
      #
      # Exemption portee par l'ETAPE (comme dans partner-node) : Dependabot n'ecrit jamais de
      # doc, et ses bumps d'actions touchent .github/workflows/ — aucune de ses PR ne pourrait
      # passer. Les autres gardes s'appliquent normalement a ses PR.
      - name: Check docs drift
        if: github.actor != 'dependabot[bot]'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"; head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE"; head_sha="$PUSH_AFTER"
          fi
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          node scripts/check-doc-drift.mjs --base-ref "$base_sha" --head-ref "$head_sha"

      # Les gardes qui echouent EN VERT (lot D du plan parc-et-gardes). Dix occurrences
      # recensees sur le parc, dont les deux smokes de ce depot qui sortaient en SUCCES
      # quand APP_URL manquait.
      - name: Gardes fail-open (check-fail-open)
        run: pnpm ci:check-fail-open

      # Domaines *.kycly.io ecrits en dur dans les workflows (lot A du plan parc-et-gardes,
      # porte le 2026-09-30) : un domaine propre a un stage ne peut vivre que dans un
      # workflow propre a ce stage — sinon passer par vars.APP_URL. Le defaut d'origine :
      # un smoke « staging » pointe sur l'API de production pendant 7 semaines.
      - name: Domaines des workflows (check-workflow-urls)
        run: pnpm ci:check-workflow-urls

      - name: Check docs truth
        run: pnpm docs:truth

      - name: Check docs structure
        run: pnpm docs:structure

      - name: Check code docs up to date
        run: pnpm docs:codegen:check

      - name: Guard sandbox-only
        run: pnpm guard:sandbox-only

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Browser smoke
        run: pnpm test:e2e